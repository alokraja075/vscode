name: Build Corde IDE MSI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js (v22)
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Yarn globally
      run: npm install -g yarn

    - name: Install WiX Toolset via Dotnet CLI
      run: |
        dotnet tool install --global wix --version 4.0.1
        echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

    - name: Set Up Branded Identity and Patches
      run: |
        # 1. Update product.json properties securely
        $prod = Get-Content "product.json" -Raw | ConvertFrom-Json
        
        function Set-Property ($obj, $name, $value) {
            if ($null -eq $obj.$name) {
                $obj | Add-Member -NotePropertyName $name -NotePropertyValue $value -Force
            } else {
                $obj.$name = $value
            }
        }

        Set-Property $prod "nameShort" "CordeIDE"
        Set-Property $prod "nameLong" "Corde IDE"
        Set-Property $prod "applicationName" "corde-ide"
        Set-Property $prod "dataFolderName" ".corde-ide"
        Set-Property $prod "win32MutexName" "cordeide"
        Set-Property $prod "win32RegValueName" "CordeIDE"
        Set-Property $prod "win32AppId" "{C00DE1DE-E5F6-7A8B-9C0D-1E2F3A4B5C6D}"
        Set-Property $prod "win32AppUserModelId" "Corde.IDE"
        Set-Property $prod "win32DirName" "Corde IDE"
        Set-Property $prod "quality" "stable"
        
        $galleryObj = [PSCustomObject]@{
            serviceUrl = "https://visualstudio.com"
            cacheUrl   = "https://windows.net"
            itemUrl    = "https://visualstudio.com"
        }
        Set-Property $prod "extensionsGallery" $galleryObj

        $prod | ConvertTo-Json -Depth 100 | Set-Content "product.json" -Encoding UTF8

        # 2. Patch Node v22 execution configurations inline
        $extFile = "build/lib/extensions.ts"
        if (Test-Path $extFile) {
            $extContent = Get-Content -Path $extFile -Raw
            if ($extContent -match "execArgv:\s*\[\]") {
                $extContent = $extContent -replace "execArgv:\s*\[\]", 'execArgv: ["--experimental-strip-types"]'
                Set-Content -Path $extFile -Value $extContent -NoNewline -Encoding UTF8
            }
        }

    - name: Install Project Dependencies (via Yarn)
      env:
        UV_THREADPOOL_SIZE: 64
        NODE_OPTIONS: --max-old-space-size=8192 --experimental-strip-types
        VSCODE_SKIP_NODE_VERSION_CHECK: 1
      run: yarn install --frozen-lockfile

    - name: Compile Corde IDE Binaries
      env:
        UV_THREADPOOL_SIZE: 64
        NODE_OPTIONS: --max-old-space-size=8192 --experimental-strip-types
        VSCODE_SKIP_NODE_VERSION_CHECK: 1
      run: yarn gulp vscode-win32-x64-min

    - name: Generate Layout Manifest & Build MSI Installer
      run: |
        $SourceBinaries = Join-Path (Get-Item .).Parent.FullName "VSCode-win32-x64"
        if (-not (Test-Path $SourceBinaries)) { throw "Compilation payload folder missing at $SourceBinaries" }
        
        $ExeName = "Code.exe"
        if (-not (Test-Path "$SourceBinaries\Code.exe")) {
            $foundExe = Get-ChildItem -Path $SourceBinaries -Filter "*.exe" | Where-Object { $_.Name -notmatch "inno" } | Select-Object -First 1
            if ($foundExe) { $ExeName = $foundExe.Name }
        }

        # Initialize modern WiX 4 syntax structures
        wix extension add WixToolset.UI.wixext

        $WxsContent = @"
        <Wix xmlns="http://wixtoolset.org" xmlns:ui="http://wixtoolset.org/ui">
            <Package Name="Corde IDE" Language="1033" Version="1.0.0" Manufacturer="Corde" UpgradeCode="D01D01DE-A1B2-4C3D-8EBF-F1E2D3C4B5A6" Scope="perMachine">
                <MajorUpgrade DowngradeErrorMessage="A newer version of Corde IDE is already installed." />
                <MediaTemplate EmbedCab="yes" />

                <StandardDirectory Id="ProgramFiles64Folder">
                    <Directory Id="INSTALLFOLDER" Name="Corde IDE" />
                </StandardDirectory>

                <StandardDirectory Id="ProgramMenuFolder">
                    <Directory Id="ApplicationProgramsFolder" Name="Corde IDE"/>
                </StandardDirectory>

                <Component Id="ApplicationShortcut" Guid="E1DE0000-B1B2-4C3D-8EBF-F1E2D3C4B5A6" Directory="ApplicationProgramsFolder">
                    <Shortcut Id="ApplicationStartMenuShortcut" Name="Corde IDE" Description="Launch Corde IDE" Target="[INSTALLFOLDER]\$ExeName" WorkingDirectory="INSTALLFOLDER"/>
                    <RemoveFolder Id="CleanUpShortCut" On="uninstall"/>
                    <RegistryValue Root="HKCU" Key="Software\CordeIDE" Name="installed" Type="integer" Value="1" KeyPath="yes"/>
                </Component>

                <Feature Id="Main">
                    <ComponentRef Id="ApplicationShortcut" />
                    <Files Include="$SourceBinaries\**" />
                </Feature>
                
                <ui:WixUI Id="WixUI_Minimal" />
            </Package>
        </Wix>
        "@
        Set-Content -Path "corde-main.wxs" -Value $WxsContent -Encoding UTF8
        
        wix build corde-main.wxs -out Corde_IDE_x64.msi

    - name: Upload Completed MSI Package
      uses: actions/upload-artifact@v4
      with:
        name: Corde-IDE-Windows-Installer
        path: Corde_IDE_x64.msi
